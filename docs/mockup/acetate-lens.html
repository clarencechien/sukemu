<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>疊層譯讀器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --room:#0E1319; --panel:#151C25; --edge:#233240;
  --pale:#B9C9D8; --mute:#6C8296;
  --hot:#FF4A14; --hot-deep:#C82800; --cool:#41C9FF;
  --veil:.30;
  --chrome:'IBM Plex Sans Condensed',system-ui,sans-serif;
  --data:'IBM Plex Mono',ui-monospace,monospace;
  --doc:'Noto Sans TC',system-ui,sans-serif;
  --u:7px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--room);color:var(--pale);font-family:var(--chrome);
  display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

.bar{flex:0 0 auto;display:flex;align-items:center;gap:.9rem;padding:.55rem 1rem;
  border-bottom:1px solid var(--edge);background:var(--panel);flex-wrap:wrap}
.mark b{font-weight:700;font-size:.84rem;letter-spacing:.16em;text-transform:uppercase}
.mark span{font-family:var(--data);font-size:.56rem;color:var(--mute);margin-left:.5rem}
.langs{font-family:var(--data);font-size:.64rem;color:var(--mute)}
.langs b{color:var(--cool);font-weight:500}
.spacer{flex:1 1 auto}
.dial{display:flex;align-items:center;gap:.4rem;font-family:var(--data);font-size:.56rem;color:var(--mute)}
.dial input{width:5rem;accent-color:var(--cool)}
.dial b{color:var(--pale);font-weight:400;min-width:2.1rem;text-align:right}
.seg{display:flex;border:1px solid var(--edge);border-radius:2px;overflow:hidden}
.seg button{appearance:none;background:transparent;border:0;border-right:1px solid var(--edge);
  color:var(--mute);font-family:var(--chrome);font-weight:600;font-size:.64rem;letter-spacing:.1em;
  text-transform:uppercase;padding:.38rem .6rem;cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--cool);color:#04121B}
.seg button kbd{font-family:var(--data);font-size:.85em;opacity:.55;margin-left:.3em}
.flip{appearance:none;border:1px solid var(--hot);background:transparent;color:var(--hot);border-radius:2px;
  font-family:var(--chrome);font-weight:700;font-size:.64rem;letter-spacing:.1em;padding:.38rem .65rem;cursor:pointer}
.flip:hover{background:var(--hot);color:#180500}
.pick{appearance:none;background:transparent;border:1px solid var(--edge);border-radius:2px;
  color:var(--mute);font-family:var(--data);font-size:.6rem;padding:.38rem .5rem;cursor:pointer}
:is(.seg button,.pick,.flip,.hold,.blk,.note):focus-visible{outline:2px solid var(--cool);outline-offset:2px}

/* ── stage ──────────────────────────────────── */
.stage{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1.1rem;min-height:0;overflow:hidden;
  background:radial-gradient(ellipse 62% 58% at 50% 42%,#182430 0%,var(--room) 74%)}
body[data-mode=note] .stage{justify-content:flex-start;overflow:hidden;gap:1rem}
.frame{position:relative;display:block;flex:0 0 auto}
.plate{position:relative;display:block;line-height:0;box-shadow:0 20px 56px -20px #000C}
.plate img{display:block;width:auto;height:auto}

.acetate{position:absolute;inset:0;transform-origin:50% 46%;
  transition:opacity .22s,transform .3s cubic-bezier(.2,.8,.3,1),filter .22s}
body.lifted .acetate{opacity:0;transform:translateY(-1.6%) scale(1.03);filter:blur(4px)}

.blk{position:absolute;display:flex;align-items:center;justify-content:center;cursor:pointer;
  padding:calc(var(--u)*.22);font-family:var(--doc);text-align:center;
  transition:transform .16s cubic-bezier(.2,.8,.3,1)}
.blk .veil{position:absolute;inset:calc(var(--u)*-.18);border-radius:calc(var(--u)*.16);
  backdrop-filter:blur(1.4px) saturate(.55) brightness(1.16);
  -webkit-backdrop-filter:blur(1.4px) saturate(.55) brightness(1.16);
  background:linear-gradient(160deg,rgba(206,238,255,calc(var(--veil)*.9)),rgba(228,244,255,calc(var(--veil)*.55)));
  box-shadow:inset 0 0 0 1px rgba(65,201,255,.28);transition:box-shadow .16s,background .16s}
.blk .txt{position:relative;line-height:1.3;width:100%;font-weight:700;color:var(--hot);word-break:break-word;
  text-shadow:0 0 calc(var(--u)*.14) #FFF,0 0 calc(var(--u)*.34) rgba(255,255,255,.9),0 calc(var(--u)*.04) 0 rgba(255,255,255,.85)}
.corner{position:absolute;width:calc(var(--u)*.85);height:calc(var(--u)*.85);opacity:.42;transition:opacity .16s;pointer-events:none}
.corner i{position:absolute;background:var(--cool)}
.corner i:first-child{inset:0 auto auto 0;width:100%;height:1.5px}
.corner i:last-child{inset:0 auto auto 0;width:1.5px;height:100%}
.c-tl{top:calc(var(--u)*-.18);left:calc(var(--u)*-.18)}
.c-tr{top:calc(var(--u)*-.18);right:calc(var(--u)*-.18);transform:scaleX(-1)}
.c-bl{bottom:calc(var(--u)*-.18);left:calc(var(--u)*-.18);transform:scaleY(-1)}
.c-br{bottom:calc(var(--u)*-.18);right:calc(var(--u)*-.18);transform:scale(-1)}
.blk:hover .veil{box-shadow:inset 0 0 0 1px rgba(65,201,255,.6)}
.blk[aria-current=true]{transform:translateY(calc(var(--u)*-.14))}
.blk[aria-current=true] .veil{box-shadow:inset 0 0 0 1.5px var(--hot),0 calc(var(--u)*.16) calc(var(--u)*.5) rgba(255,74,20,.22);
  background:linear-gradient(160deg,rgba(255,236,226,calc(var(--veil)*1.05)),rgba(255,246,240,calc(var(--veil)*.7)))}
.blk[aria-current=true] .corner{opacity:1}
.blk[aria-current=true] .corner i{background:var(--hot)}
.blk[data-low=true] .veil{box-shadow:inset 0 0 0 1px rgba(255,74,20,.34)}
.blk[data-low=true] .txt{color:var(--hot-deep)}

/* 編號錨點 */
.pin{position:absolute;width:calc(var(--u)*1.6);height:calc(var(--u)*1.6);transform:translate(-50%,-50%);
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.pin::before{content:'';position:absolute;inset:0;border-radius:50%;background:var(--hot);
  box-shadow:0 0 0 calc(var(--u)*.14) rgba(255,255,255,.92),0 calc(var(--u)*.06) calc(var(--u)*.4) rgba(0,0,0,.4)}
.pin b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--data);font-size:calc(var(--u)*.7);color:#fff;font-weight:500;z-index:1}
body[data-mode=note] .pin{opacity:1}
body[data-mode=note] .pin[data-on=true]{transform:translate(-50%,-50%) scale(1.35)}
body[data-mode=note] .blk :is(.veil,.txt),body[data-mode=note] .corner{opacity:0}

/* ── 註解欄 ─────────────────────────────────── */
.notepane{display:none;width:100%;max-width:64ch;flex:1 1 auto;min-height:0;flex-direction:column}
body[data-mode=note] .notepane{display:flex}
.noteshead{flex:0 0 auto;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;
  padding-bottom:.5rem;border-bottom:1px solid var(--edge)}
.noteshead h2{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:600}
.filters{display:flex;gap:.3rem;margin-left:auto}
.filters button{appearance:none;background:transparent;border:1px solid var(--edge);border-radius:2px;
  color:var(--mute);font-family:var(--chrome);font-weight:600;font-size:.6rem;letter-spacing:.08em;
  padding:.22rem .5rem;cursor:pointer;white-space:nowrap}
.filters button[aria-pressed=true]{border-color:var(--hot);color:var(--hot)}
.filters button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.notes{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:var(--edge) transparent}
.note{display:grid;grid-template-columns:2.1rem 1fr;gap:.7rem;padding:.65rem .5rem;cursor:pointer;
  border-bottom:1px solid rgba(35,50,64,.6);transition:background .15s}
.note[aria-current=true]{order:-1;position:sticky;top:0;z-index:1;background:#16232E;
  box-shadow:0 6px 18px -8px #000,inset 3px 0 0 var(--hot)}
body[data-filter=nt] .note:not([data-nt=true]):not([aria-current=true]),
body[data-filter=low] .note:not([data-low=true]):not([aria-current=true]){display:none}
.note:hover{background:rgba(255,255,255,.03)}
.note .n{font-family:var(--data);font-size:.68rem;color:var(--hot);padding-top:.15rem;
  display:flex;align-items:flex-start;justify-content:center}
.note[aria-current=true] .n{font-weight:500}
.note .z{font-family:var(--doc);font-weight:700;font-size:.92rem;color:#FF7A4A;line-height:1.55}
.note .e{font-size:.72rem;color:var(--mute);line-height:1.5;margin-top:.25rem}
.note .nt{font-family:var(--doc);font-size:.74rem;color:var(--cool);line-height:1.6;
  margin-top:.4rem;padding-left:.6rem;border-left:2px solid rgba(65,201,255,.3)}
.note .flag{font-family:var(--data);font-size:.58rem;color:var(--hot);margin-top:.3rem}

body[data-mode=off] .acetate{opacity:0;pointer-events:none}
body[data-mode=dot] .blk :is(.veil,.txt),body[data-mode=dot] .corner{opacity:0}
body[data-mode=dot] .blk::before{content:'';position:absolute;left:calc(var(--u)*.3);top:calc(var(--u)*.3);
  width:calc(var(--u)*1);height:calc(var(--u)*1);border-radius:50%;background:var(--hot);
  box-shadow:0 0 0 calc(var(--u)*.2) rgba(255,255,255,.92),0 0 calc(var(--u)*.5) rgba(255,74,20,.7)}
body[data-mode=dot] .blk[aria-current=true] :is(.veil,.txt),
body[data-mode=dot] .blk[aria-current=true] .corner{opacity:1;transition:opacity .18s}

/* ── deck ───────────────────────────────────── */
.deck{flex:0 0 auto;border-top:1px solid var(--edge);background:var(--panel);display:flex;min-height:5.4rem}
.hold{appearance:none;flex:0 0 auto;width:10.5rem;border:0;border-right:1px solid var(--edge);
  background:transparent;color:var(--pale);cursor:pointer;font-family:var(--chrome);font-weight:700;
  font-size:.76rem;letter-spacing:.14em;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.3rem;touch-action:none;user-select:none;-webkit-user-select:none}
.hold small{font-family:var(--data);font-size:.54rem;letter-spacing:0;color:var(--mute);font-weight:400}
.hold:active,body.lifted .hold{background:var(--cool);color:#04121B}
.insp{flex:1 1 auto;padding:.7rem 1rem;display:flex;flex-direction:column;gap:.35rem;min-width:0;overflow:auto}
.row{display:flex;gap:.8rem;align-items:baseline;flex-wrap:wrap}
.tag{font-family:var(--data);font-size:.54rem;color:var(--mute);flex:0 0 3rem}
.src{font-size:.76rem;color:var(--mute);line-height:1.45;flex:1 1 13rem;min-width:0}
.tgt{font-family:var(--doc);font-weight:500;font-size:.86rem;color:var(--hot);line-height:1.5;
  flex:1 1 13rem;min-width:0;border:1px dashed var(--edge);border-radius:2px;padding:.22rem .4rem;outline:none}
.tgt:focus{border-color:var(--hot);border-style:solid}
.meta{display:flex;gap:1.1rem;font-family:var(--data);font-size:.56rem;color:var(--mute);flex-wrap:wrap}
.meta b{color:var(--pale);font-weight:400}
.conf i{display:inline-block;width:.36rem;height:.36rem;border-radius:50%;background:var(--cool);margin-right:.3rem}
.conf.low i{background:var(--hot)}
.empty{color:var(--mute);font-size:.74rem}

@media (max-width:700px){
  .deck{flex-direction:column}
  .hold{width:100%;border-right:0;border-bottom:1px solid var(--edge);padding:.7rem;flex-direction:row;gap:.6rem}
  .dial{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01s!important}
  body.lifted .acetate{transform:none;filter:none}
  .blk[aria-current=true]{transform:none}
}
</style>

<div class="bar">
  <div class="mark"><b>疊層譯讀器</b><span>v0.5</span></div>
  <div class="langs">EN → <b>正體中文</b></div>
  <div class="spacer"></div>
  <label class="dial">縮放<input type="range" id="zoom" min="55" max="130" value="100" aria-label="圖片縮放"><b id="zoomv">100%</b></label>
  <label class="dial">強度<input type="range" id="veil" min="0" max="60" value="30" aria-label="疊層強度"><b id="veilv">.30</b></label>
  <button class="pick" id="swap">切換圖片</button>
  <div class="seg" role="group" aria-label="顯示方式">
    <button data-mode="overlay" aria-pressed="true">A 疊字<kbd>1</kbd></button>
    <button data-mode="note" aria-pressed="false">C 註解<kbd>2</kbd></button>
    <button data-mode="dot" aria-pressed="false">標點<kbd>3</kbd></button>
    <button data-mode="off" aria-pressed="false">隱藏<kbd>4</kbd></button>
  </div>
  <button class="flip" id="flip">A ⇄ C <kbd style="font-family:var(--data);opacity:.6">X</kbd></button>
</div>

<div class="stage" id="stage">
  <div class="frame" id="frame"><div class="plate"><img id="plate" alt=""><div class="acetate" id="acetate"></div></div></div>
  <div class="notepane" id="notepane">
    <div class="noteshead">
      <h2>譯註 · <span id="ncount"></span></h2>
      <div class="filters" role="group" aria-label="篩選">
        <button data-filter="all" aria-pressed="true">全部</button>
        <button data-filter="nt" aria-pressed="false">有譯註</button>
        <button data-filter="low" aria-pressed="false">待複核</button>
      </div>
    </div>
    <div class="notes" id="notes"></div>
  </div>
</div>

<div class="deck">
  <button class="hold" id="hold">按住看原圖<small>hold · 或按住 O</small></button>
  <div class="insp" id="insp"></div>
</div>

  {x:31.8,y:5.2,w:37.6,h:7.6,fs:3.4,c:.99,en:"Defining the Harness",zh:"什麼是掛載系統(Harness)?",nt:"Harness 業界多直接沿用英文;亦見「執行框架」「掛載層」。首次出現保留原文。"},
  {x:9.6,y:21.0,w:18.0,h:29.0,fs:1.68,c:.98,en:"The Harness: The engineered runtime that wraps a large language model and converts its raw text output into reliable system behavior.",zh:"掛載系統(Harness):包裹大型語言模型的工程化執行環境,負責把模型原始的文字輸出,轉換成可靠的系統行為。"},
  {x:9.6,y:54.4,w:18.0,h:35.0,fs:1.68,c:.98,en:"Harness engineering is the discipline of treating the runtime as a first-class engineering artifact, much like SRE treats production infrastructure as code.",zh:"掛載系統工程:把執行環境視為一級工程產物的學科,就像 SRE 把生產環境的基礎設施視為程式碼一樣。",nt:"SRE = Site Reliability Engineering,以軟體工程方法處理維運問題的學科。"},

};
const stage=document.getElementById('stage'),plate=document.getElementById('plate'),
      acetate=document.getElementById('acetate'),insp=document.getElementById('insp'),
      hold=document.getElementById('hold'),notes=document.getElementById('notes'),
      ncount=document.getElementById('ncount');
let key='a',cur=-1,noteEls=[],zoom=1;
const mode=()=>document.body.dataset.mode;

function render(){
  const d=DATA[key];plate.src=d.src;plate.alt=d.name;
  acetate.innerHTML='';noteEls=[];
  notes.innerHTML='';
  d.blocks.forEach((b,i)=>{
    const el=document.createElement('div');
    el.className='blk';el.tabIndex=0;el.setAttribute('role','button');
    el.dataset.low=b.c<.9;el.setAttribute('aria-label',`標註 ${i+1}:${b.zh}`);
    el.style.cssText=`left:${b.x}%;top:${b.y}%;width:${b.w}%;height:${b.h}%`;
    el.innerHTML=`<div class="veil"></div><div class="txt" style="font-size:calc(var(--u)*${b.fs})">${b.zh}</div>`+
      ['tl','tr','bl','br'].map(c=>`<span class="corner c-${c}"><i></i><i></i></span>`).join('');
    el.onclick=()=>select(i,'img');el.onfocus=()=>select(i,'img');acetate.appendChild(el);

    const pin=document.createElement('div');pin.className='pin';
    pin.style.left=(b.x+b.w/2)+'%';pin.style.top=(b.y+b.h/2)+'%';
    pin.innerHTML=`<b>${i+1}</b>`;acetate.appendChild(pin);b._pin=pin;

    const n=document.createElement('div');
    n.className='note';n.tabIndex=0;n.setAttribute('role','button');
    n.dataset.nt=!!b.nt;n.dataset.low=b.c<.9;
    n.innerHTML=`<div class="n">${String(i+1).padStart(2,'0')}</div><div>
      <div class="z">${b.zh}</div><div class="e">${b.en}</div>
      ${b.nt?`<div class="nt">${b.nt}</div>`:''}
      ${b.c<.9?`<div class="flag">▲ 版面信心 ${b.c.toFixed(2)} · 建議複核</div>`:''}</div>`;
    n.onclick=()=>select(i,'note');n.onfocus=()=>select(i,'note');
    notes.appendChild(n);noteEls.push(n);
  });
  cur=-1;paint();countNotes();fit();
}
function select(i,from){
  cur=i;paint();
  // 選取項靠 flex order 頂到最上,不捲動畫面;只把捲軸歸零確保看得到
  if(mode()==='note'&&from==='img')notes.scrollTop=0;
}
function setFilter(f){
  document.querySelectorAll('.filters button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.filter===f));
  document.body.dataset.filter=f;countNotes();
}
function countNotes(){
  const d=DATA[key],f=document.body.dataset.filter||'all';
  const n=d.blocks.filter(b=>f==='nt'?b.nt:f==='low'?b.c<.9:true).length;
  ncount.textContent=f==='all'?`${n} 則標註`:`${n} / ${d.blocks.length} 則`;
}
function paint(){
  const d=DATA[key];
  [...acetate.querySelectorAll('.blk')].forEach((el,i)=>el.setAttribute('aria-current',i===cur));
  d.blocks.forEach((b,i)=>b._pin&&(b._pin.dataset.on=i===cur));
  noteEls.forEach((n,i)=>n.setAttribute('aria-current',i===cur));
  if(cur<0){insp.innerHTML='<div class="empty">點選圖上的標註或下方註解 — 譯文可直接編輯。按 X 在 A(疊字)與 C(註解)之間切換</div>';return}
  const b=d.blocks[cur],low=b.c<.9;
  insp.innerHTML=`<div class="row"><span class="tag">原文</span><div class="src">${b.en}</div></div>
    <div class="row"><span class="tag">譯文</span><div class="tgt" contenteditable="true" spellcheck="false" id="edit">${b.zh}</div></div>
    <div class="meta"><span class="conf ${low?'low':''}"><i></i>版面信心 <b>${b.c.toFixed(2)}</b>${low?' · 建議複核':''}</span>
    <span>座標 <b>${b.x.toFixed(1)}, ${b.y.toFixed(1)}</b> · 尺寸 <b>${b.w.toFixed(1)} × ${b.h.toFixed(1)}</b>%</span>
    <span>譯註 <b>${b.nt?'有':'—'}</b></span><span>標註 <b>${cur+1} / ${d.blocks.length}</b></span></div>`;
  const ed=document.getElementById('edit');
  ed.oninput=()=>{b.zh=ed.textContent;
    acetate.querySelectorAll('.blk')[cur].querySelector('.txt').textContent=b.zh;
    noteEls[cur].querySelector('.z').textContent=b.zh};
}
function fit(){
  if(!plate.naturalWidth)return;
  const cs=getComputedStyle(stage),r=stage.getBoundingClientRect();
  const availW=r.width-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const availH=(r.height-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom))*(mode()==='note'?.5:1);
  const ar=plate.naturalWidth/plate.naturalHeight;
  const w=Math.max(140,Math.min(availW,availH*ar)*zoom);
  plate.style.width=w+'px';
  document.documentElement.style.setProperty('--u',(w/100)+'px');
}
plate.addEventListener('load',fit);
new ResizeObserver(fit).observe(stage);

function setMode(m){
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));
  document.body.dataset.mode=m;requestAnimationFrame(fit);
}
document.querySelectorAll('.seg button').forEach(btn=>btn.onclick=()=>setMode(btn.dataset.mode));
document.querySelectorAll('.filters button').forEach(btn=>btn.onclick=()=>setFilter(btn.dataset.filter));
setMode('overlay');setFilter('all');
document.getElementById('flip').onclick=()=>setMode(mode()==='note'?'overlay':'note');
document.getElementById('swap').onclick=()=>{key=key==='a'?'b':'a';render()};
const zoomEl=document.getElementById('zoom'),zoomv=document.getElementById('zoomv');
zoomEl.oninput=()=>{zoom=zoomEl.value/100;zoomv.textContent=zoomEl.value+'%';fit()};
const veil=document.getElementById('veil'),veilv=document.getElementById('veilv');
veil.oninput=()=>{const v=veil.value/100;
  document.documentElement.style.setProperty('--veil',v);veilv.textContent=v.toFixed(2).slice(1)};

const lift=on=>document.body.classList.toggle('lifted',on);
hold.addEventListener('pointerdown',e=>{e.preventDefault();hold.setPointerCapture(e.pointerId);lift(true)});
['pointerup','pointercancel'].forEach(t=>hold.addEventListener(t,()=>lift(false)));
hold.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();lift(true)}});
hold.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')lift(false)});
addEventListener('keydown',e=>{
  if(e.target.isContentEditable)return;
  if((e.key==='o'||e.key==='O')&&!e.repeat)lift(true);
  if(e.key==='x'||e.key==='X')setMode(mode()==='note'?'overlay':'note');
  const m={'1':'overlay','2':'note','3':'dot','4':'off'}[e.key];if(m)setMode(m);
});
addEventListener('keyup',e=>{if(e.key==='o'||e.key==='O')lift(false)});
let t;acetate.addEventListener('pointerdown',()=>{t=setTimeout(()=>lift(true),450)});
addEventListener('pointerup',()=>{clearTimeout(t);lift(false)});
render();
</script>
